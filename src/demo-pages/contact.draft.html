<section class="demo-landing-hero demo-landing-hero-contact" aria-labelledby="demo-page-title">
  <div data-demo-header-slot></div>
  <div class="demo-landing-intro">
    <p class="demo-eyebrow">Grow beyond the mat</p>
    <h1 id="demo-page-title">Contact YogaRise</h1>
    <p class="demo-draft-notice">Local design review only. Contact details and form destination are awaiting confirmation. This draft does not send enquiries.</p>
    <form class="demo-enquiry-form" data-demo-draft-form>
      <fieldset disabled>
        <legend>Get in touch</legend>
        <div class="demo-form-grid">
          <label>Name<input name="name" autocomplete="name" required /></label>
          <label>Email address<input name="email" type="email" autocomplete="email" required /></label>
          <label>Phone (optional)<input name="phone" type="tel" autocomplete="tel" /></label>
          <label class="demo-form-full">Message<textarea name="message" required></textarea></label>
        </div>
      </fieldset>
      <button class="button button-light" type="submit" disabled>Send enquiry <span aria-hidden="true">→</span></button>
      <p role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
